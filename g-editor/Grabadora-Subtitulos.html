<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grabadora</title>
<!-- Paquete Pages · player + captura + VAD + Whisper opcional. -->
<style>
:root{
  --fondo:#0f0f1a; --panel:#131826; --sec:#1a1a2e; --ctl:#24243a;
  --borde:#1f2638; --borde2:#2a2a40;
  --rosa:#ff2e63; --verde:#4ade80; --txt:#fff; --secu:#8a8a9e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif}
body{padding:18px 12px 40px}
#app{max-width:420px;margin:0 auto;background:var(--panel);border:1px solid var(--borde);border-radius:22px;padding:14px 16px 18px}
.top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;font-size:12px;color:var(--secu)}
.top .grow{flex:1}
#modo{font-size:11px;line-height:1.35}
#modo.lim{color:#e7c771}
#modo.ok{color:var(--verde)}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--verde)}
.badge.rec{color:var(--rosa)}
button{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--borde2);background:var(--ctl);color:var(--txt);font:13px Inter,system-ui;cursor:pointer}
button[disabled]{opacity:.4;cursor:default}
select{height:36px;flex:1;min-width:0;padding:0 10px;border-radius:8px;border:1px solid var(--borde2);background:var(--ctl);color:var(--txt);font:13px Inter,system-ui}
.x{width:28px;height:28px;border-radius:50%;padding:0}
h1{margin:0 0 12px;font-size:20px;letter-spacing:.04em}
.card{background:var(--sec);border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:12px}
.tit{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#c5cadb;font-weight:700}
.aviso{display:none;padding:8px 10px;border-radius:8px;background:#3a1524;border:1px solid var(--rosa);color:#ffd0dc;font-size:12px;margin:0 0 12px}
.aviso.on{display:block}
.recRow{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center}
.recBtn{width:80px;height:80px;border-radius:50%;border:3px solid var(--rosa);background:transparent;color:#fff;font-size:22px}
.recBtn.rec{background:var(--rosa)}
canvas{width:100%;height:56px;background:#0f0f1a;border:1px solid var(--borde);border-radius:6px;display:block}
.timer{font:16px ui-monospace,Menlo,monospace;text-align:center;margin:8px 0 0}
.hint{font-size:11px;color:var(--secu);margin:8px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.li{display:grid;grid-template-columns:36px 1fr auto auto auto;gap:8px;align-items:center;background:var(--ctl);border:1px solid var(--borde2);border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer}
.li.sel{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde)}
.li .play{width:36px;height:36px;padding:0;border-radius:50%;font-size:14px}
.li .meta{min-width:0}
.li input[type=range]{width:100%;height:6px;accent-color:var(--verde);margin:6px 0 0}
.li .tplay{font:11px ui-monospace,Menlo,monospace;color:var(--secu)}
audio.oculto{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
.vacio{color:var(--secu);font-size:12px;text-align:center}
.cue{display:grid;grid-template-columns:72px 72px 1fr auto;gap:6px;align-items:center;background:var(--ctl);border:1px solid var(--borde2);border-radius:8px;padding:8px;margin-bottom:6px}
.cue input[type=number]{height:32px;width:100%;background:#12182a;border:1px solid var(--borde2);color:var(--txt);border-radius:6px;padding:0 6px;font:12px ui-monospace,Menlo,monospace}
.cue input[type=text]{height:32px;width:100%;background:#12182a;border:1px solid var(--borde2);color:var(--txt);border-radius:6px;padding:0 8px}
#banco{display:none}
#banco.on{display:block}
.test{font-size:12px;padding:6px 0;border-bottom:1px solid var(--borde)}
.test.ok{color:var(--verde)}
.test.ko{color:#ff8aa3}
.progWh{display:none;height:6px;border-radius:99px;background:#24243a;overflow:hidden;margin:8px 0 0}
.progWh.on{display:block}
.progWh i{display:block;height:100%;width:0;background:#ff2e63;border-radius:99px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div id="modo" class="lim"></div>
    <span class="grow"></span>
    <span class="badge" id="badge">LISTO</span>
    <button type="button" id="bBanco" title="Banco">Σ</button>
    <button type="button" class="x" id="bX" title="Cerrar">×</button>
  </div>
  <h1>GRABADORA</h1>
  <div class="aviso" id="aviso"></div>
  <section class="card">
    <p class="tit">Grabador</p>
    <div class="row" style="margin:0 0 10px">
      <select id="fuente" title="Fuente de audio">
        <option value="mic">Micrófono</option>
        <option value="pestana">Pestaña</option>
        <option value="pantalla">Pantalla</option>
        <option value="mezcla">Mic + PC</option>
      </select>
    </div>
    <p class="hint" id="hintFuente" style="margin:0 0 10px">Micrófono de este equipo.</p>
    <label class="hint" style="display:flex;align-items:center;gap:8px;margin:0 0 10px;cursor:pointer">
      <input type="checkbox" id="filtrosMic"> Filtros del mic (eco, ruido, ganancia)
    </label>
    <div class="recRow">
      <button type="button" class="recBtn" id="bGrabar">●</button>
      <canvas id="onda" width="640" height="56"></canvas>
    </div>
    <p class="timer" id="timer">00:00.0</p>
    <p class="hint" id="codec">Codec: —</p>
    <div class="row">
      <button type="button" id="bInsertar" disabled>Insertar →</button>
      <button type="button" id="bDescartar" disabled>Descartar</button>
    </div>
  </section>
  <section class="card">
    <p class="tit">Mis tomas</p>
    <div id="lista"></div>
  </section>
  <section class="card">
    <p class="tit">Subtítulos</p>
    <div class="row">
      <button type="button" id="bImpSrt">Importar SRT/VTT</button>
      <button type="button" id="bExpSrt" disabled>Exportar SRT</button>
      <button type="button" id="bExpVtt" disabled>Exportar VTT</button>
      <button type="button" id="bTranscribir">Transcribir toma</button>
    </div>
    <p class="hint" id="estWhisper">Whisper: buscando motor…</p>
    <div class="progWh" id="barraWhisper"><i id="barraWhisperI"></i></div>
    <div class="row">
      <button type="button" id="bWhisperDown">Descargar modelo (~75 MB)</button>
      <button type="button" id="bWhisperDel">Borrar modelo</button>
    </div>
    <input type="file" id="fSrt" accept=".srt,.vtt,text/vtt" hidden>
    <div id="listaSubs" style="margin-top:10px"></div>
  </section>
  <section class="card" id="banco">
    <p class="tit">Banco Σ (sin micrófono)</p>
    <button type="button" id="bRun">Correr pruebas</button>
    <div id="testOut"></div>
  </section>
</div>
<audio id="player" class="oculto" preload="metadata"></audio>
<script>
window.Grabadora = null;
(function(){
  'use strict';
  const ENTORNO = location.protocol === 'file:' ? 'limitado' : 'completo';
  const TIENE_WEBGPU = 'gpu' in navigator;
  const P = { medios: new Map(), clips: {}, sel: null, selm: new Set(), t: 0 };
  const PISTAS = [
    { id:'video-1', tipo:'video', nombre:'Vídeo 1' },
    { id:'audio-1', tipo:'audio', nombre:'Audio 1' }
  ];
  const $ = id => document.getElementById(id);
  const LISTO = 'listo', GRABANDO = 'grabando', COMPLETADO = 'completado';
  let estado = LISTO;
  let rec = null, chunks = [], streamToma = null, micVivo = null;
  let extra = [], ctxMix = null, fuenteActiva = 'mic';
  let ctx = null, analyser = null, raf = 0, tick = 0;
  let t0 = 0, dur = 0, blob = null, mime = '', url = null;
  let currentId = null, selId = null, player = null, playId = null, seeking = false;

  function aviso(t){
    const a = $('aviso');
    a.textContent = t || '';
    a.classList.toggle('on', !!t);
  }
  function fmt(s){
    s = Math.max(0, +s || 0);
    const m = Math.floor(s / 60);
    const r = s - m * 60;
    return String(m).padStart(2,'0') + ':' + r.toFixed(1).padStart(4,'0');
  }
  function nextId(pref, enMedios){
    let n = 1, id;
    do { id = pref + String(n).padStart(3,'0'); n++; }
    while (enMedios ? P.medios.has(id) : P.clips[id]);
    return id;
  }
  function asegurarAudio(){
    let p = PISTAS.find(x => x.id === 'audio-1');
    if (!p){ p = { id:'audio-1', tipo:'audio', nombre:'Audio 1' }; PISTAS.push(p); }
    return p;
  }
  function nomNueva(){
    const n = [...P.medios.values()].filter(m => m.tipo === 'grabacion').length;
    return 'Toma ' + (n + 1);
  }

  const Hist = { pila:[], mudo:0 };
  function instantanea(){
    return JSON.stringify({ clips:P.clips, pistas:PISTAS, sel:P.sel });
  }
  function enLote(motivo, fn){
    if (!Hist.mudo) Hist.pila.push({ motivo, estado: instantanea() });
    Hist.mudo++;
    try{ return fn(); }
    finally{ Hist.mudo--; }
  }

  function parseT(x){
    const m = String(x).trim().replace(',','.').match(/(?:(\d+):)?(\d+):(\d+)[.,](\d+)/);
    if (!m) return null;
    const h = +(m[1]||0), mi = +m[2], s = +m[3], frac = m[4];
    const ms = frac.length === 3 ? +frac : +String(frac).padEnd(3,'0').slice(0,3);
    return h*3600 + mi*60 + s + ms/1000;
  }
  function srtT(s){
    s = Math.max(0, +s || 0);
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    const sec = s - h*3600 - m*60;
    const ent = Math.floor(sec);
    const ms = Math.round((sec-ent)*1000);
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ent).padStart(2,'0')+','+String(ms).padStart(3,'0');
  }
  function leerSRT(txt){
    txt = String(txt||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
    const out = [];
    String(txt).split(/\n\s*\n/).forEach((b, idx) => {
      const ls = b.split('\n').map(x => x.trim()).filter(Boolean);
      const flecha = ls.find(x => x.indexOf('-->') >= 0);
      if (!flecha) return;
      const p = flecha.split('-->');
      const a = parseT(p[0]);
      const b2 = parseT((p[1]||'').trim().split(/\s+/)[0]);
      if (a == null || b2 == null || b2 <= a) return;
      const texto = ls.filter(x => !/^\d+$/.test(x) && x.indexOf('-->') < 0).join('\n');
      out.push({ t0:a, t1:b2, texto, _i:idx });
    });
    out.sort((x,y) => x.t0 - y.t0 || x._i - y._i);
    return out.map(({t0,t1,texto}) => ({ t0, t1, texto }));
  }
  function leerVTT(txt){
    txt = String(txt||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').replace(/^WEBVTT[^\n]*\n+/i,'');
    return leerSRT(txt);
  }
  function escribirSRT(cues){
    return (cues||[]).filter(c => String(c.texto||'').trim()).map((c,i) =>
      (i+1)+'\n'+srtT(c.t0)+' --> '+srtT(c.t1)+'\n'+c.texto+'\n'
    ).join('\n');
  }
  function escribirVTT(cues){
    const t = s => srtT(s).replace(',','.');
    return 'WEBVTT\n\n'+(cues||[]).filter(c => String(c.texto||'').trim()).map(c =>
      t(c.t0)+' --> '+t(c.t1)+'\n'+c.texto+'\n'
    ).join('\n');
  }

  function asegurarSub(){
    if (!P.medios.has('sub-1'))
      P.medios.set('sub-1', { tipo:'subtitulos', nom:'Subtítulos', pista:'sub-1' });
    if (!PISTAS.some(p => p.id === 'sub-1'))
      PISTAS.push({ id:'sub-1', tipo:'subtitulo', nombre:'Subtítulos' });
    return PISTAS.find(p => p.id === 'sub-1');
  }
  function clipACue(c){
    const pr = c.props || {};
    return {
      id: c.id,
      t0: pr.t0 != null ? pr.t0 : c.inicio,
      t1: pr.t1 != null ? pr.t1 : (c.inicio + c.duracion),
      texto: pr.texto || '',
      estilo: pr.estilo || {},
      trackId: pr.trackId || c.pista
    };
  }
  function cuesDePista(){
    const p = PISTAS.find(x => x.id === 'sub-1' && x.tipo === 'subtitulo');
    if (!p) return [];
    return Object.values(P.clips).filter(c => c.pista === 'sub-1').map(clipACue).sort((a,b) => a.t0 - b.t0);
  }
  function hayPistaSub(){ return PISTAS.some(p => p.id === 'sub-1' && p.tipo === 'subtitulo'); }
  function meterCues(arr){
    return enLote('importar subtítulos', () => {
      asegurarSub();
      let n = 0;
      arr.forEach(s => {
        if (!(s.t1 > s.t0)) return;
        const id = nextId('cue-', false);
        P.clips[id] = {
          id, medio:'sub-1', pista:'sub-1',
          inicio:s.t0, duracion:s.t1 - s.t0,
          props:{ texto:s.texto||'', estilo:s.estilo||{}, t0:s.t0, t1:s.t1, trackId:'sub-1' }
        };
        n++;
      });
      pintarCues();
      return n;
    });
  }
  function pintarCues(){
    const box = $('listaSubs');
    const cues = cuesDePista();
    const on = hayPistaSub() && cues.length > 0;
    $('bExpSrt').disabled = !hayPistaSub();
    $('bExpVtt').disabled = !hayPistaSub();
    if (!hayPistaSub()){
      box.innerHTML = '<p class="vacio">Importa un .srt o .vtt</p>';
      return;
    }
    if (!cues.length){
      box.innerHTML = '<p class="vacio">Pista vacía</p>';
      return;
    }
    box.innerHTML = '';
    cues.forEach(s => {
      const d = document.createElement('div');
      d.className = 'cue';
      d.innerHTML = '<input type="number" step="0.01" data-a>' +
        '<input type="number" step="0.01" data-b>' +
        '<input type="text" data-t>' +
        '<button type="button" data-x>🗑</button>';
      d.querySelector('[data-a]').value = (+s.t0).toFixed(2);
      d.querySelector('[data-b]').value = (+s.t1).toFixed(2);
      d.querySelector('[data-t]').value = s.texto;
      const aplicarT = () => {
        const a = +d.querySelector('[data-a]').value;
        const b = +d.querySelector('[data-b]').value;
        if (!isFinite(a) || !isFinite(b) || b <= a) return;
        enLote('editar rango', () => {
          const c = P.clips[s.id];
          c.inicio = a; c.duracion = b - a;
          c.props.t0 = a; c.props.t1 = b;
        });
      };
      d.querySelector('[data-a]').onchange = aplicarT;
      d.querySelector('[data-b]').onchange = aplicarT;
      d.querySelector('[data-t]').onchange = ev => {
        enLote('editar subtítulo', () => { P.clips[s.id].props.texto = ev.target.value; });
      };
      d.querySelector('[data-x]').onclick = () => {
        enLote('borrar subtítulo', () => { delete P.clips[s.id]; });
        pintarCues();
      };
      box.appendChild(d);
    });
  }
  function stampNom(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
  }
  function descargar(nom, txt){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type:'text/plain' }));
    a.download = nom;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  function exportar(kind){
    if (!hayPistaSub()){ aviso('No hay pista de subtítulos.'); return ''; }
    const cues = cuesDePista();
    const txt = kind === 'vtt' ? escribirVTT(cues) : escribirSRT(cues);
    if (!String(txt).replace(/^WEBVTT\s*/i,'').trim()){
      aviso('No hay subtítulos para exportar.');
      return '';
    }
    descargar('subtitulos-'+stampNom()+'.'+(kind==='vtt'?'vtt':'srt'), txt);
    return txt;
  }
  function pintarModo(){
    const el = $('modo');
    if (!el) return;
    if (ENTORNO === 'limitado'){
      el.className = 'lim';
      el.textContent = 'file:// · permiso del mic no se guarda entre recargas.';
    } else {
      el.textContent = '';
      el.className = '';
    }
  }
  function pintarBadge(){
    const b = $('badge');
    b.className = 'badge' + (estado === GRABANDO ? ' rec' : '');
    b.textContent = estado === GRABANDO ? 'GRABANDO' : (estado === COMPLETADO ? 'COMPLETADO' : 'LISTO');
    $('bGrabar').classList.toggle('rec', estado === GRABANDO);
    $('bGrabar').textContent = estado === GRABANDO ? '■' : '●';
    $('bInsertar').disabled = !(estado === COMPLETADO || selId);
    $('bDescartar').disabled = estado !== COMPLETADO;
  }
  function pintarOnda(vivo, data){
    const cv = $('onda');
    const g = cv.getContext('2d');
    const w = cv.width, h = cv.height;
    g.fillStyle = '#0f0f1a'; g.fillRect(0,0,w,h);
    for (let i = 0; i < 48; i++){
      let v = 0.1;
      if (vivo && data) v = Math.max(0.08, Math.abs(data[Math.floor(i * data.length / 48)] / 255 - 0.5) * 2);
      const bh = Math.max(3, v * (h - 10));
      g.fillStyle = '#4ade80';
      g.fillRect(8 + i * ((w - 16) / 48), (h - bh) / 2, Math.max(2, (w - 16) / 48 - 3), bh);
    }
  }
  function bucleOnda(){
    if (estado !== GRABANDO || !analyser) return;
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    pintarOnda(true, buf);
    raf = requestAnimationFrame(bucleOnda);
  }
  function mmss(s){
    s = Math.max(0, +s || 0);
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
  }
  function filaToma(id){ return document.querySelector('#lista .li[data-id="'+id+'"]'); }
  function pintarPlayUI(id){
    document.querySelectorAll('#lista .li').forEach(el => {
      const on = el.dataset.id === id && player && !player.paused;
      const b = el.querySelector('[data-p]');
      if (b) b.textContent = on ? '⏸' : '▶';
    });
  }
  function pintarTiempo(id, cur, tot){
    const el = filaToma(id); if (!el) return;
    const sl = el.querySelector('input[type=range]');
    const t = el.querySelector('.tplay');
    tot = tot || 0;
    if (sl && !seeking){
      sl.max = String(tot || 0);
      sl.value = String(Math.min(cur || 0, tot || 0));
    }
    if (t) t.textContent = mmss(cur) + ' / ' + mmss(tot);
  }
  function pintarLista(){
    const box = $('lista');
    const tomas = [...P.medios.values()].filter(m => m.tipo === 'grabacion');
    if (!tomas.length){ box.innerHTML = '<p class="vacio">Aún no hay tomas</p>'; return; }
    box.innerHTML = '';
    tomas.forEach(m => {
      const d = document.createElement('div');
      d.className = 'li' + (m.id === selId ? ' sel' : '');
      d.dataset.id = m.id;
      const on = playId === m.id && player && !player.paused;
      const cur = (playId === m.id && player) ? player.currentTime : 0;
      d.innerHTML = '<button type="button" class="play" data-p title="Reproducir"></button>' +
        '<div class="meta"><strong></strong><input type="range" min="0" step="0.01" data-s>' +
        '<div class="tplay"></div></div>' +
        '<button type="button" data-w title="Transcribir">✦</button>' +
        '<button type="button" data-i title="Insertar">→</button>' +
        '<button type="button" data-x title="Borrar">🗑</button>';
      d.querySelector('strong').textContent = m.nom + (m.insertado ? ' · insertada' : '');
      d.querySelector('[data-p]').textContent = on ? '⏸' : '▶';
      const sl = d.querySelector('[data-s]');
      sl.max = String(m.dur || 0);
      sl.value = String(cur);
      d.querySelector('.tplay').textContent = mmss(cur) + ' / ' + mmss(m.dur);
      d.onclick = ev => {
        if (ev.target.closest('button') || ev.target.closest('input')) return;
        selId = m.id; blob = m.blob || null; currentId = m.id;
        pintarLista(); pintarBadge();
      };
      d.querySelector('[data-p]').onclick = ev => { ev.stopPropagation(); togglePlay(m); };
      sl.oninput = ev => {
        ev.stopPropagation();
        seeking = true;
        pintarTiempo(m.id, +sl.value, m.dur);
      };
      sl.onchange = ev => {
        ev.stopPropagation();
        seeking = false;
        seekTo(m, +sl.value);
      };
      d.querySelector('[data-w]').onclick = ev => { ev.stopPropagation(); transcribirToma(m.id); };
      d.querySelector('[data-i]').onclick = ev => { ev.stopPropagation(); insertar(m.id); };
      d.querySelector('[data-x]').onclick = ev => { ev.stopPropagation(); borrar(m.id); };
      box.appendChild(d);
    });
  }
  function pararPlayer(){
    if (!player) return;
    try{ player.pause(); }catch(_){}
    if (player._u){ try{ URL.revokeObjectURL(player._u); }catch(_){} }
    player = null; playId = null;
  }
  function engancharPlayer(el){
    el.ontimeupdate = () => {
      if (!playId) return;
      const m = P.medios.get(playId);

  async function vadDeBlob(blob){
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const buf = await ac.decodeAudioData(await blob.arrayBuffer());
    try{ ac.close(); }catch(_){}
    const data = buf.getChannelData(0), rate = buf.sampleRate;
    const win = Math.max(1, Math.floor(rate * 0.02));
    const rms = [];
    for (let i = 0; i + win <= data.length; i += win){
      let a = 0;
      for (let k = 0; k < win; k++) a += data[i+k] * data[i+k];
      rms.push({ t: i / rate, e: Math.sqrt(a / win) });
    }
    if (rms.length < 6) return [];
    const ord = rms.map(x => x.e).slice().sort((a,b) => a-b);
    const p20 = ord[Math.floor(ord.length*0.2)] || 0.01;
    const p80 = ord[Math.floor(ord.length*0.8)] || 0.08;
    if (p80 - p20 < 0.004 && p80 > 0.02)
      return [{ t0:0, t1: data.length / rate, texto:'[Voz local]' }];
    const suelo = Math.max(0.008, p20);
    const alto = Math.max(suelo * 2.2, suelo + (p80 - suelo) * 0.45);
    const bajo = suelo * 1.35;
    const raw = [];
    let voz = false, ini = 0, last = 0;
    rms.forEach(p => {
      if (!voz && p.e >= alto){ voz = true; ini = Math.max(0, p.t - 0.04); last = p.t; }
      else if (voz && p.e >= bajo) last = p.t;
      else if (voz && p.t - last >= 0.14){
        if (last - ini >= 0.22) raw.push({ t0: ini, t1: last + 0.04, texto:'[Voz local]' });
        voz = false;
      }
    });
    if (voz && last - ini >= 0.22) raw.push({ t0: ini, t1: last + 0.04, texto:'[Voz local]' });
    return raw;
  }
